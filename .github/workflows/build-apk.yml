name: Build LEGENDS XI APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HAS_RELEASE_KEY: ${{ secrets.LXI_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build & validate the football database
        run: python3 data-src/build.py

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Decode release keystore (optional)
        if: env.HAS_RELEASE_KEY == 'true'
        run: |
          echo "${{ secrets.LXI_KEYSTORE_BASE64 }}" | base64 -d > $RUNNER_TEMP/release.keystore
          echo "LXI_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> $GITHUB_ENV
          echo "LXI_KEYSTORE_PASSWORD=${{ secrets.LXI_KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
          echo "LXI_KEY_ALIAS=${{ secrets.LXI_KEY_ALIAS }}" >> $GITHUB_ENV
          echo "LXI_KEY_PASSWORD=${{ secrets.LXI_KEY_PASSWORD }}" >> $GITHUB_ENV

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          if [ -n "$LXI_KEYSTORE_PATH" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk ../LEGENDS-XI.apk
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk ../LEGENDS-XI.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: LEGENDS-XI-apk
          path: LEGENDS-XI.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: LEGENDS XI v1.0.${{ github.run_number }}
          body: |
            LEGENDS XI — Football Time Machine
            Created by Dr HOSSAM Mo

            Download **LEGENDS-XI.apk** below and open it on your Android phone to install.
          files: LEGENDS-XI.apk
